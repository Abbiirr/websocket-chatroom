<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-container {
            max-width: 500px;
            margin: 50px auto;
        }
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .loading-overlay.active {
            display: flex;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-light">
<div class="loading-overlay" id="loadingOverlay">
    <div class="text-center text-white">
        <div class="spinner mb-3"></div>
        <h4>Processing your registration...</h4>
        <p>Please wait</p>
    </div>
</div>

<div class="container">
    <div class="form-container">
        <div class="card shadow">
            <div class="card-body p-5">
                <h2 class="text-center mb-4">Complete Your Registration</h2>

                <div class="alert alert-info mb-4">
                    <small>
                        <strong>OAuth Verified:</strong><br>
                        <span th:text="${email}"></span>
                    </small>
                </div>

                <form action="/register/submit" method="post" id="registrationForm">
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" required
                               placeholder="Enter your full name">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email"
                               th:value="${email}" required readonly>
                        <small class="form-text text-muted">Email verified via OAuth</small>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required
                               placeholder="Create a password" minlength="6">
                        <small class="form-text text-muted">Minimum 6 characters</small>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            Complete Registration
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('registrationForm').addEventListener('submit', function(e) {
        // Show loading overlay when form is submitted
        document.getElementById('loadingOverlay').classList.add('active');
    });
</script>
</body>
</html>
