<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .loading-container {
            text-align: center;
            color: white;
        }
        .spinner {
            width: 80px;
            height: 80px;
            border: 8px solid rgba(255, 255, 255, 0.3);
            border-top: 8px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .info-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            margin-top: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .dot-animation {
            display: inline-block;
        }
        .dot-animation span {
            animation: blink 1.4s infinite;
        }
        .dot-animation span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .dot-animation span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes blink {
            0%, 20%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
<div class="loading-container">
    <div class="spinner"></div>

    <h1 class="mb-4">Processing Your Registration</h1>

    <h3 class="pulse">
        Please wait<span class="dot-animation"><span>.</span><span>.</span><span>.</span></span>
    </h3>

    <div class="info-card">
        <h5 class="mb-3">Registration Details</h5>
        <p class="mb-2">
            <strong>Name:</strong> <span th:text="${name}"></span>
        </p>
        <p class="mb-0">
            <strong>Email:</strong> <span th:text="${email}"></span>
        </p>
    </div>

    <div class="mt-5">
        <p class="text-white-50">
            <small>Your account is being set up. This may take a few moments.</small>
        </p>
    </div>
</div>
</body>
</html>
